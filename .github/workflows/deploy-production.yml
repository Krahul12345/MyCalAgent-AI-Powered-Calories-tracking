name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Vercel access
        run: |
          bunx vercel project inspect app --scope itikishore-1632s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel environment
        run: bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_OvgBQBeXusUZeSYPqhwMI5pc
          VERCEL_PROJECT_ID: prj_t2cOtyTnC6IzC1ueHmAXb1bXmIHY

      - name: Seed required production settings
        run: |
          printf '%s' "$DATABASE_URL" | bunx vercel env add DATABASE_URL production --force --token=${{ secrets.VERCEL_TOKEN }}
          printf '%s' "$BETTER_AUTH_SECRET" | bunx vercel env add BETTER_AUTH_SECRET production --force --token=${{ secrets.VERCEL_TOKEN }}
          bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_OvgBQBeXusUZeSYPqhwMI5pc
          VERCEL_PROJECT_ID: prj_t2cOtyTnC6IzC1ueHmAXb1bXmIHY
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Verify required production settings
        run: |
          bunx vercel env ls production --token=${{ secrets.VERCEL_TOKEN }}
          bun --env-file=.vercel/.env.production.local -e 'const missing = ["DATABASE_URL", "BETTER_AUTH_SECRET"].filter(key => !process.env[key]); if (missing.length) { console.error("Required production settings unavailable: " + missing.join(", ")); process.exit(1); }'
        env:
          VERCEL_ORG_ID: team_OvgBQBeXusUZeSYPqhwMI5pc
          VERCEL_PROJECT_ID: prj_t2cOtyTnC6IzC1ueHmAXb1bXmIHY

      - name: Validate release
        run: |
          bun run typecheck
          bun run lint
          bun run audit:visibility
          bun audit

      - name: Build for Vercel
        run: bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_OvgBQBeXusUZeSYPqhwMI5pc
          VERCEL_PROJECT_ID: prj_t2cOtyTnC6IzC1ueHmAXb1bXmIHY

      - name: Prepare production newsletter table
        run: bun --env-file=.vercel/.env.production.local scripts/prepare-newsletter.mjs

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url="$(bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url"
        env:
          VERCEL_ORG_ID: team_OvgBQBeXusUZeSYPqhwMI5pc
          VERCEL_PROJECT_ID: prj_t2cOtyTnC6IzC1ueHmAXb1bXmIHY
